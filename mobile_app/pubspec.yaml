name: dms_mobile
description: Mobile management application for the DMS fleet safety platform.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: 10.3.1
  http: ^1.2.2
  path_provider: 2.1.4
  shared_preferences: ^2.3.2
  video_player: 2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
